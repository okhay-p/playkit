name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, unit tests, formatting, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: bash -n scripts/ci-quality-gate.sh
      - run: npm run build

  browser:
    name: Browser (${{ matrix.project }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
            shard: 1/1
          - project: phone
            browser: chromium
            shard: 1/1
          - project: firefox
            browser: firefox
            shard: 1/1
          - project: webkit
            browser: webkit
            shard: 1/2
          - project: webkit
            browser: webkit
            shard: 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install the selected browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser scenarios
        run: npm run test:e2e:full -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Summarize test timings
        if: ${{ !cancelled() && hashFiles('playwright-report/results.json') != '' }}
        run: npm run test:e2e:timings
      - name: Upload reports and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every validation job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: bash scripts/ci-quality-gate.sh
